<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace Skills Module: all epics prototype</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--line:#dcdfe4;--line2:#eceef1;--text:#1f2328;--muted:#606873;--accent:#2c6ee5;--accent-bg:#e8f0fd;--navy:#14233b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button,select{font:inherit;color:inherit}
.bar{background:var(--navy);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar b{font-size:13px}
.bar label{font-size:12px;color:#cfe0ff;display:flex;gap:6px;align-items:center}
.bar select{background:#243a5c;border:0;color:#fff;border-radius:6px;padding:4px 6px;font-size:12px}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:0;max-width:1480px;margin:0 auto;align-items:start}
.side{position:sticky;top:0;max-height:100vh;overflow:auto;padding:14px 10px 24px 14px}
.side h4{margin:14px 0 4px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.side h4 small{text-transform:none;letter-spacing:0;font-weight:400}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text)}
.side button:hover{background:#e9edf3}
.side button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.main{padding:14px 14px 28px 6px;min-width:0}
.jr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.jr select{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:#f1f3f6}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn[disabled]{opacity:.45;cursor:not-allowed}
.dots{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.dots i{font-style:normal;font-size:11px;border-radius:10px;padding:2px 8px;background:#eef1f5;color:var(--muted);cursor:pointer}
.dots i.on{background:var(--accent);color:#fff}.dots i.done{background:#dff1e6;color:#1b7f4a}
iframe[hidden],.ov[hidden]{display:none!important}
iframe{width:100%;border:0;display:block;background:transparent;min-height:560px}
.ov{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.ov h1{margin:0 0 4px;font-size:22px}.ov p{color:var(--muted);margin:0 0 12px}
.ov h2{font-size:15px;margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#f7f9fc;border-radius:14px;padding:3px 11px;cursor:pointer;font-size:12px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.note{background:#e4eef8;color:#22405f;border-radius:8px;padding:10px 12px;margin:10px 0;min-height:20px}
.node{cursor:pointer}.node:hover{opacity:.85}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.cg rect{fill:#F1EFE8;stroke:#5F5E5A}.cg .th{fill:#444441}.cg .ts{fill:#5F5E5A}
.cp rect{fill:#EEEDFE;stroke:#534AB7}.cp .th{fill:#3C3489}.cp .ts{fill:#534AB7}
.ct rect{fill:#E1F5EE;stroke:#0F6E56}.ct .th{fill:#085041}.ct .ts{fill:#0F6E56}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}}
</style>
</head>
<body>
<div class="bar"><b>Marketplace Skills Module: all epics (prototype, sample data)</b>
<label>View as <select id="role" onchange="setRole(this.value)"><option value="author">Author</option><option value="reader">Reader (read only)</option><option value="reviewer">Reviewer</option><option value="security">Security reviewer</option><option value="admin">Admin</option></select></label>
<label><input type="checkbox" id="notes" checked onchange="setNotes(this.checked)"> API notes</label></div>
